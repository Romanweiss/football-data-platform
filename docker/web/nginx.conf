worker_processes auto;
pid /tmp/nginx.pid;
# Lower-level Nginx upstream errors include raw request/query text. Use safe
# status-only access logs for those; retain fatal process diagnostics separately.
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # No query strings, cookies, authorization headers or upstream credentials.
    log_format safe '$request_method $uri status=$status duration=$request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # Docker DNS: resolve at request time, including after API recreation.
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        location = /healthz { access_log off; return 200 'ok\n'; }
        location ~ ^/api(?:/|$) {
            set $api_upstream football-api-prod:8000;
            proxy_pass http://$api_upstream$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 65s;
            proxy_intercept_errors off;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
        }
        location /assets/ {
            # Fingerprinted Vite assets only; missing assets must be real 404s.
            try_files $uri =404;
            expires 1y;
        }
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
