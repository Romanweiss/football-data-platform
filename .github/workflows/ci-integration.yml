name: CI integration
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      superset_image:
        description: Also build the large Superset image and test its actual Jinja/dialects
        type: boolean
        default: false
permissions:
  contents: read
env:
  # Keep artifacts limited to explicitly configured fixture-browser failures.
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  s3-recovery-windows:
    name: Synthetic S3 recovery and real Windows ACLs
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        # ACL helpers spawn Windows PowerShell through Python. Avoid inheriting
        # PowerShell 7 module paths, which break Windows PowerShell autoloading.
        shell: powershell
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      PLATFORM_ALERTS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          # Exact Windows x64 build available in actions/python-versions.
          # Synthetic ACL coverage only; Linux/production pins remain unchanged.
          python-version: '3.12.10'
      - run: python -m pip install -r requirements/recovery-s3.txt
      - name: Non-secret Windows token and disposable-directory ownership diagnostics
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $probe = Join-Path $env:RUNNER_TEMP ('football-ci-acl-probe-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $probe | Out-Null
          try {
            $owner = (Get-Acl -LiteralPath $probe).GetOwner([System.Security.Principal.SecurityIdentifier]).Value
            @{
              token_owner_is_user = ($identity.Owner.Value -eq $identity.User.Value)
              token_owner_is_administrators = ($identity.Owner.Value -eq 'S-1-5-32-544')
              new_directory_owner_is_user = ($owner -eq $identity.User.Value)
              new_directory_owner_is_administrators = ($owner -eq 'S-1-5-32-544')
            } | ConvertTo-Json -Compress
          } finally {
            # Only the new empty probe directory; never recursive cleanup.
            Remove-Item -LiteralPath $probe -Force
          }
      - name: Fake transport only; network guard; real temporary-directory ACL checks
        run: |
          $ErrorActionPreference = 'Stop'
          # Hosted elevated tokens default new object ownership to Administrators.
          # Use the actual current user for newly created synthetic fixtures only.
          # Do not relax the production owner/DACL checks or repair existing files.
          Add-Type @'
          using System;
          using System.ComponentModel;
          using System.Runtime.InteropServices;
          using System.Security.Principal;
          public sealed class SyntheticOwnerScope : IDisposable {
              [StructLayout(LayoutKind.Sequential)]
              private struct TokenOwner { public IntPtr Owner; }
              [DllImport("advapi32.dll", SetLastError = true)]
              private static extern bool SetTokenInformation(
                  IntPtr token, int kind, ref TokenOwner owner, int length);
              private readonly WindowsIdentity identity;
              private readonly SecurityIdentifier previous;
              public SyntheticOwnerScope() {
                  identity = WindowsIdentity.GetCurrent(TokenAccessLevels.Query | TokenAccessLevels.AdjustDefault);
                  previous = identity.Owner;
                  try { Assign(identity.User); }
                  catch { identity.Dispose(); throw; }
              }
              private void Assign(SecurityIdentifier sid) {
                  byte[] raw = new byte[sid.BinaryLength];
                  sid.GetBinaryForm(raw, 0);
                  IntPtr buffer = Marshal.AllocHGlobal(raw.Length);
                  try {
                      Marshal.Copy(raw, 0, buffer, raw.Length);
                      TokenOwner owner = new TokenOwner { Owner = buffer };
                      // TokenOwner = 4: no identity, privileges or DACL changes.
                      if (!SetTokenInformation(identity.Token, 4, ref owner, Marshal.SizeOf(owner)))
                          throw new Win32Exception(Marshal.GetLastWin32Error());
                  } finally { Marshal.FreeHGlobal(buffer); }
              }
              public void Dispose() {
                  try { Assign(previous); }
                  finally { identity.Dispose(); }
              }
          }
          '@
          $scope = [SyntheticOwnerScope]::new()
          try {
            if ([System.Security.Principal.WindowsIdentity]::GetCurrent().Owner.Value -ne
                [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value) {
              throw 'CI_CURRENT_USER_DEFAULT_OWNER_REQUIRED'
            }
            python ci/check_s3_recovery.py
            $testExit = $LASTEXITCODE
          } finally {
            $scope.Dispose()
          }
          exit $testExit
  recovery:
    name: Synthetic isolated backup and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.14'
      - run: python -m pip install -r requirements/recovery.txt
      - run: docker pull postgres:17.6-alpine3.22
      - run: docker pull clickhouse/clickhouse-server:25.8.23.13-alpine
      - name: Synthetic only; networkless tmpfs targets; no backup artifacts uploaded
        run: python ci/check_recovery.py
  databases:
    name: Ephemeral PostgreSQL and ClickHouse
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile
          tags: football-ci-checks:8a
          load: true
          push: false
          cache-from: type=gha,scope=ci-checks
          cache-to: type=gha,mode=max,scope=ci-checks
      - name: Isolated databases (tmpfs, no developer ports/volumes)
        run: docker compose --env-file ci/empty.env -f ci/compose.yaml up -d --wait ci-postgres ci-clickhouse
      - name: PostgreSQL ordered migrations, replay and DQ/alert/reader integration
        run: docker compose --env-file ci/empty.env -f ci/compose.yaml run --rm --no-deps checks python ci/databases.py postgres
      - name: ClickHouse migrations, rollback/cutover and synthetic SQL tests
        run: docker compose --env-file ci/empty.env -f ci/compose.yaml run --rm --no-deps checks python ci/databases.py clickhouse
      - name: Stop only the ephemeral CI services
        if: always()
        run: docker compose --env-file ci/empty.env -f ci/compose.yaml stop
  spark-airflow:
    name: Pinned Spark synthetic and Airflow DAGs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Docker driver lets the second build resolve the first local image without a registry push.
      - uses: docker/setup-docker-action@v4
        with:
          version: v29.7.2
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build existing Spark runtime (cache includes pinned S3A JARs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/spark/Dockerfile
          tags: football-ci-spark:8a
          load: true
          push: false
          cache-from: type=gha,scope=ci-spark
          cache-to: type=gha,mode=max,scope=ci-spark
      - name: Synthetic Spark only, network disabled
        run: |
          # Ignored data/work exists locally but not in a fresh Git checkout.
          # The tmpfs mount needs an existing target inside the read-only bind.
          mkdir -p data/work
          for suite in test_event_core test_s3a_event_core test_event_domains test_lineup_domains test_matches test_gold_match_stats test_match_results test_context; do
            docker run --rm --network none --hostname localhost -e SPARK_LOCAL_IP=127.0.0.1 \
              --mount "type=bind,source=$PWD,target=/app,readonly" --tmpfs /app/data/work:mode=1777 \
              football-ci-spark:8a spark-submit "tests/spark/$suite.py"
          done
      - name: Build existing Airflow image against this run's Spark image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/airflow/Dockerfile
          build-contexts: project_spark=docker-image://football-ci-spark:8a
          tags: football-ci-airflow:8a
          load: true
          push: false
          cache-from: type=gha,scope=ci-airflow
          cache-to: type=gha,mode=max,scope=ci-airflow
      - name: DAG graph, parameters, schedules and no import-time IO
        run: docker run --rm --network none football-ci-airflow:8a python /app/tests/airflow/test_dag.py
  application-images:
    name: Application Docker builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          target: production
          tags: football-ci-${{ matrix.image }}:8b
          load: true
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}
      - name: Non-root production image, configuration and shipped-content audit
        run: python ci/check_delivery.py --audit-image football-ci-${{ matrix.image }}:8b --kind ${{ matrix.image }}
  superset-image:
    name: Optional actual Superset image contracts
    if: github.event_name == 'workflow_dispatch' && inputs.superset_image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/superset/Dockerfile
          tags: football-ci-superset:8a
          load: true
          push: false
          cache-from: type=gha,scope=ci-superset
          cache-to: type=gha,mode=max,scope=ci-superset
      - name: Image dependencies and actual safe Jinja rendering
        run: |
          docker run --rm --network none --mount "type=bind,source=$PWD,target=/workspace,readonly" --entrypoint python football-ci-superset:8a /workspace/tests/superset/test_image.py
          docker run --rm --network none --mount "type=bind,source=$PWD,target=/workspace,readonly" --entrypoint python football-ci-superset:8a /workspace/tests/superset/test_semantic_safety.py
