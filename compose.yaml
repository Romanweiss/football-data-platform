name: ${COMPOSE_PROJECT_NAME:-football-data-platform}

x-football-airflow: &football-airflow
  image: football-airflow:3.2.2
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
    additional_contexts:
      project_spark: docker-image://football-spark-runtime:6c1-0b540b6bee67
  profiles: [airflow]
  user: "50000:0"
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: /usr/bin/python3 /opt/airflow/config/bootstrap.py connection
    AIRFLOW__CORE__FERNET_KEY_CMD: /usr/bin/python3 /opt/airflow/config/bootstrap.py fernet_key
    AIRFLOW__API_AUTH__JWT_SECRET_CMD: /usr/bin/python3 /opt/airflow/config/bootstrap.py jwt_secret
    AIRFLOW__API__SECRET_KEY_CMD: /usr/bin/python3 /opt/airflow/config/bootstrap.py api_secret
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/secrets/simple_auth_manager_passwords.json
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://football-airflow-api:8080/execution/
    AIRFLOW__API__BASE_URL: http://localhost:${AIRFLOW_HOST_PORT:-18080}
    AIRFLOW__API__WORKERS: "1"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
  volumes:
    - football_airflow_secrets:/opt/airflow/secrets:ro
    - football_airflow_logs:/opt/airflow/logs
  networks: [football-network]

services:
  football-grafana-bootstrap:
    image: football-python-tools:3.12
    profiles: [grafana]
    user: "0:0"
    working_dir: /app
    command: [python, infrastructure/grafana/bootstrap.py, init]
    environment:
      POSTGRES_HOST: football-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - .:/app:ro
      - football_grafana_secrets:/run/grafana-secrets
    networks: [football-network]
    depends_on:
      football-postgres:
        condition: service_healthy
    restart: "no"

  football-grafana:
    image: grafana/grafana:13.0.1
    profiles: [grafana]
    user: "472:0"
    entrypoint: [sh, /etc/grafana/entrypoint.sh]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/grafana-secrets/admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_LEVEL: warn
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-13000}:3000"
    volumes:
      - football_grafana_data:/var/lib/grafana
      - football_grafana_secrets:/run/grafana-secrets:ro
      - ./infrastructure/grafana/entrypoint.sh:/etc/grafana/entrypoint.sh:ro
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [football-network]
    depends_on:
      football-grafana-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  football-airflow-bootstrap:
    <<: *football-airflow
    user: "0:0"
    environment: {}
    command: [/usr/bin/python3, /opt/airflow/config/bootstrap.py, init]
    volumes:
      - football_airflow_secrets:/opt/airflow/secrets
      - football_airflow_logs:/opt/airflow/logs
    restart: "no"

  football-airflow-db:
    image: postgres:17.6-alpine3.22
    profiles: [airflow]
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD_FILE: /run/airflow-secrets/db_password
    volumes:
      - football_airflow_db_data:/var/lib/postgresql/data
      - football_airflow_secrets:/run/airflow-secrets:ro
    networks: [football-network]
    depends_on:
      football-airflow-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  football-airflow-init:
    <<: *football-airflow
    command: [sh, -c, "airflow db migrate && airflow pools set spark_local 1 'One local Spark job'"]
    restart: "no"
    depends_on:
      football-airflow-db:
        condition: service_healthy

  football-airflow-api:
    <<: *football-airflow
    command: [airflow, api-server]
    # SimpleAuthManager locks its pre-generated password file with a+.
    volumes:
      - football_airflow_secrets:/opt/airflow/secrets
      - football_airflow_logs:/opt/airflow/logs
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-18080}:8080"
    depends_on:
      football-airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /usr/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  football-airflow-dag-processor:
    <<: *football-airflow
    command: [airflow, dag-processor]
    restart: unless-stopped
    depends_on:
      football-airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  football-airflow-scheduler:
    <<: *football-airflow
    command: [airflow, scheduler]
    restart: unless-stopped
    environment:
      <<: *airflow-environment
      PLATFORM_ALERTS_ENABLED: ${PLATFORM_ALERTS_ENABLED:-false}
      PLATFORM_ALERT_PROVIDER: ${PLATFORM_ALERT_PROVIDER:-log}
      PLATFORM_DQ_EXCLUDED_CONTEXTS: ${PLATFORM_DQ_EXCLUDED_CONTEXTS:-}
      POSTGRES_HOST: football-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CLICKHOUSE_HOST: football-clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SPARK_LOCAL_IP: 127.0.0.1
    depends_on:
      football-airflow-api:
        condition: service_healthy
      football-airflow-dag-processor:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  football-postgres:
    image: postgres:17.6-alpine3.22
    container_name: football-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - football_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/postgres/migrations:/migrations:ro
    networks:
      - football-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  football-clickhouse:
    image: clickhouse/clickhouse-server:25.8.23.13-alpine
    container_name: football-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      SUPERSET_CLICKHOUSE_PASSWORD: ${SUPERSET_CLICKHOUSE_PASSWORD:?Set a separate SUPERSET_CLICKHOUSE_PASSWORD in .env}
    ports:
      - "${CLICKHOUSE_HTTP_HOST_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_HOST_PORT}:9000"
    volumes:
      - football_clickhouse_data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./infrastructure/clickhouse/migrations:/migrations:ro
      - ./infrastructure/clickhouse/users.d/10_named_collection_access.xml:/etc/clickhouse-server/users.d/10_named_collection_access.xml:ro
      - ./infrastructure/clickhouse/users.d/20_superset_reader.xml:/etc/clickhouse-server/users.d/20_superset_reader.xml:ro
    networks:
      - football-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  football-superset-db:
    image: postgres:17.6-alpine3.22
    container_name: football-superset-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SUPERSET_DB_NAME:-superset}
      POSTGRES_USER: ${SUPERSET_DB_USER:-superset_user}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:-}
    volumes:
      - football_superset_db_data:/var/lib/postgresql/data
    networks:
      - football-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  football-superset-init:
    image: football-superset:6.0.0
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    restart: "no"
    command: ["python", "/app/pythonpath/init_superset.py"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-}
      SUPERSET_DB_HOST: football-superset-db
      SUPERSET_DB_NAME: ${SUPERSET_DB_NAME:-superset}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER:-superset_user}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:-}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-}
      SUPERSET_CLICKHOUSE_USER: ${SUPERSET_CLICKHOUSE_USER}
      SUPERSET_CLICKHOUSE_PASSWORD: ${SUPERSET_CLICKHOUSE_PASSWORD}
    depends_on:
      football-superset-db:
        condition: service_healthy
    networks:
      - football-network
    healthcheck:
      disable: true

  football-superset:
    image: football-superset:6.0.0
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    container_name: football-superset
    restart: unless-stopped
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-}
      SUPERSET_DB_HOST: football-superset-db
      SUPERSET_DB_NAME: ${SUPERSET_DB_NAME:-superset}
      SUPERSET_DB_USER: ${SUPERSET_DB_USER:-superset_user}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:-}
      SUPERSET_CLICKHOUSE_USER: ${SUPERSET_CLICKHOUSE_USER}
      SUPERSET_CLICKHOUSE_PASSWORD: ${SUPERSET_CLICKHOUSE_PASSWORD}
    ports:
      - "127.0.0.1:${SUPERSET_HOST_PORT:-18088}:8088"
    depends_on:
      football-superset-db:
        condition: service_healthy
      football-superset-init:
        condition: service_completed_successfully
    networks:
      - football-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r = urllib.request.urlopen('http://localhost:8088/health', timeout=4); assert r.status == 200"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  football-web:
    image: football-web:5b
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: dev
    environment:
      API_PROXY_TARGET: http://football-api:8000
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-15173}:5173"
    networks:
      - football-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  football-api:
    image: football-api:5a
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: dev
    working_dir: /app
    environment:
      CLICKHOUSE_HOST: football-clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      # Reuse the existing SELECT-only profile; never pass ingestion credentials.
      CLICKHOUSE_USER: ${SUPERSET_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${SUPERSET_CLICKHOUSE_PASSWORD}
      API_ALLOWED_HOSTS: localhost,127.0.0.1,football-api
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18000}:8000"
    networks:
      - football-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4); assert r.status == 200"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  football-web-prod:
    profiles: [app-prod]
    image: football-web:8b
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: production
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-18090}:8080"
    depends_on:
      football-api-prod:
        condition: service_healthy
    networks:
      - football-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  football-api-prod:
    profiles: [app-prod]
    image: football-api:8b
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: production
    environment:
      API_SERVING_MODE: production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      API_ALLOWED_HOSTS: localhost,127.0.0.1,football-api-prod
      CLICKHOUSE_HOST: football-clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${SUPERSET_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${SUPERSET_CLICKHOUSE_PASSWORD}
    networks:
      - football-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4); assert r.status == 200"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  football-python-tools:
    image: football-python-tools:3.12
    build:
      context: .
      dockerfile: docker/python-tools/Dockerfile
    working_dir: /app
    command: ["python", "--version"]
    environment:
      PLATFORM_ALERTS_ENABLED: ${PLATFORM_ALERTS_ENABLED:-false}
      PLATFORM_ALERT_PROVIDER: ${PLATFORM_ALERT_PROVIDER:-log}
      PLATFORM_DQ_EXCLUDED_CONTEXTS: ${PLATFORM_DQ_EXCLUDED_CONTEXTS:-}
      CLICKHOUSE_HOST: football-clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      POSTGRES_HOST: football-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - .:/app
    networks:
      - football-network

  football-spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    working_dir: /app
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      AWS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      POSTGRES_HOST: football-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPARK_LOCAL_IP: 127.0.0.1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    volumes:
      - .:/app
    networks:
      - football-network

networks:
  football-network:
    name: football-network
    driver: bridge

volumes:
  football_grafana_data:
    name: football_grafana_data
  football_grafana_secrets:
    name: football_grafana_secrets
  football_airflow_db_data:
    name: football_airflow_db_data
  football_airflow_secrets:
    name: football_airflow_secrets
  football_airflow_logs:
    name: football_airflow_logs
  football_superset_db_data:
    name: football_superset_db_data
  football_postgres_data:
    name: football_postgres_data
  football_clickhouse_data:
    name: football_clickhouse_data
