apiVersion: 1
datasources:
  - name: Football platform metadata
    uid: football-metadata-dq
    type: grafana-postgresql-datasource
    access: proxy
    url: football-postgres:5432
    user: grafana_reader
    isDefault: true
    editable: false
    version: 1
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 4
      maxIdleConns: 2
      connMaxLifetime: 300
    secureJsonData:
      password: $GRAFANA_READER_PASSWORD
